[package]
name = "bookmark-app"
version = "1.0.0"
description = "A modern local bookmark manager"
authors = ["you"]
edition = "2021"

[lib]
name = "bookmark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
url = "2.5"
percent-encoding = "2.3"
regex = "1.10"
thiserror = "2.0"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.22"
base64 = "0.22"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
